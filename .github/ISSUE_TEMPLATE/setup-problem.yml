name: Setup problem
description: Something went wrong installing or setting up a DababonPro tool, such as Plainbrain.
labels: [setup]
body:
  - type: input
    id: tool
    attributes:
      label: Which tool
      placeholder: Plainbrain
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Which agent app
      options:
        - Codex
        - Claude Code
        - Cursor
        - Antigravity
        - Other, or the terminal
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system and Python version
      placeholder: Windows 11, Python 3.13
  - type: textarea
    id: what
    attributes:
      label: Which step, and what happened
      description: The step number from the setup page, what you expected, and what you saw. Paste any error message.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: This issue holds none of my notes, commitments, passwords or other private details.
          required: true
